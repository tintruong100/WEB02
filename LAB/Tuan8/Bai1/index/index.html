<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Ký Tài Khoản</title>
    <link rel="stylesheet" href="../css/bootstrap.min.css">
    <script src="../js/bootstrap.min.js"></script>
    <script src="../js/jquery.js"></script>
    <script src="../js/bootstrap.min.js"></script>
    <script src="../js/jquery-3.7.1.min.js"></script>
    <style>
        .error {
            color: red;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1 class="h1 text-center">ĐĂNG KÝ TÀI KHOẢN</h1>
        <form id="registrationForm">
            <div class="row mb-3 mt-3">
                <div class="col-4">
                    <label for="txtDN" class="form-label">Tên đăng nhập:</label>
                </div>
                <div class="col-8">
                    <input type="text" name="txtDN" id="txtDN" class="form-control" placeholder="Tên đăng nhập">
                    <span class="error" id="usernameError"></span>
                </div>
            </div>
            <div class="row mb-3 mt-3">
                <div class="col-4">
                    <label for="txtMK" class="form-label">Mật khẩu:</label>
                </div>
                <div class="col-8">
                    <input type="password" name="txtMK" id="txtMK" class="form-control" placeholder="Mật khẩu">
                    <span class="error" id="passwordError"></span>
                </div>
            </div>
            <div class="row mb-3 mt-3">
                <div class="col-4">
                    <label for="txtNLMK">Nhập lại mật khẩu:</label>
                </div>
                <div class="col-8">
                    <input type="password" name="txtNLMK" id="txtNLMK" class="form-control" placeholder="Nhập lại mật khẩu">
                    <span class="error" id="confirmPasswordError"></span>
                </div>
            </div>
            <h5 class="h5 text-center">THÔNG TIN CÁ NHÂN</h5>
            <div class="row mb-3 mt-3">
                <div class="col-4">
                    <label for="txtName" class="form-label">Họ và tên:</label>
                </div>
                <div class="col-8">
                    <input type="text" name="txtName" id="txtName" class="form-control" placeholder="Họ và tên">
                    <span class="error" id="nameError"></span>
                </div>
            </div>
            <div class="row mb-3 mt-3">
                <div class="col-4">
                    <label for="date" class="form-label">Ngày sinh:</label>
                </div>
                <div class="col-8">
                    <input type="date" name="date" id="date" class="form-control">
                    <span class="error" id="dobError"></span>
                </div>
            </div>
            <div class="row mb-3 mt-3">
                <div class="col-4">
                    <label for="gender">Giới tính:</label>
                </div>
                <div class="col-8">
                    <div class="form-check">
                        <input type="radio" name="gender" id="male" value="male" class="form-check-input">
                        <label for="male" class="form-check-label">Nam</label>
                    </div>
                    <div class="form-check">
                        <input type="radio" name="gender" id="female" value="female" class="form-check-input">
                        <label for="female" class="form-check-label">Nữ</label>
                    </div>
                </div>
            </div>
            <div class="row mb-3 mt-3">
                <div class="col-4">
                    <label for="txtDC" class="form-label">Địa chỉ:</label>
                </div>
                <div class="col-8">
                    <input type="text" name="txtDC" id="txtDC" class="form-control">
                    <span class="error" id="addressError"></span>
                </div>
            </div>
            <div class="row mb-3 mt-3">
                <div class="col-4">
                    <label for="txtDT" class="form-label">Số điện thoại:</label>
                </div>
                <div class="col-8">
                    <input type="tel" name="txtDT" id="txtDT" class="form-control">
                    <span class="error" id="phoneError"></span>
                </div>
            </div>
            <div class="row mb-3 mt-3">
                <div class="col-4">
                    <label for="txtEmail" class="form-label">Email:</label>
                </div>
                <div class="col-8">
                    <input type="email" name="txtEmail" id="txtEmail" class="form-control">
                    <span class="error" id="emailError"></span>
                </div>
            </div>
            <div class="text-center">
                <button type="submit" class="btn btn-dark">Đăng ký</button>
                <button type="reset" class="btn btn-dark">Hủy</button>
            </div>
        </form>
    </div>
    <script src="../js/script.js"></script>
</body>

</html>
